[workspace]
members = [
    "crates/clipflow-common",
    "crates/clipflow-timeline",
    "crates/clipflow-media",
    "crates/clipflow-ipc",
    "crates/clipflow-ui",
    "crates/clipflow-app"
]
resolver = "2"

[workspace.package]
version = "0.3.0"
authors = ["ClipFlow Team"]
edition = "2024" # Rust 1.99 uses 2024 edition

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.13", features = ["v4", "serde"] }
windows-sys = "0.59"
wgpu = "30.0"
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = ["default", "wgpu"] }

